er;padding:25px 5px}.medal{width:88px;height:88px;border-radius:28px;margin:0 auto 16px;background:linear-gradient(135deg,#ffd1b0,#ef741b);display:grid;place-items:center;font-size:39px;box-shadow:0 12px 27px #ef741b35}.result-hero h2{font-size:37px}.score-big{font-size:54px;letter-spacing:-.06em;font-weight:950;color:#55595a}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.result-cell{background:#f2f7fb;border:1px solid var(--line);border-radius:14px;padding:13px}.result-cell strong{font-size:22px;display:block}.result-cell small{color:#718197;font-size:11px}.footer-note{color:#8291a1;font-size:11px;line-height:1.5;margin-top:17px}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#142e49;color:white;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;z-index:5;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.leader-note{background:#f7f9fc;border:1px dashed #cbd7e4;padding:12px 14px;border-radius:12px;color:#6d7d90;font-size:12px;line-height:1.5}.panel .tag{border:1px solid #dce5ef;background:#f3f6fa;color:#617286}

.crossword-topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0}.cross-board-wrap{overflow:auto;max-width:100%;padding:12px 0 8px}.cross-board{display:grid;gap:2px;width:max-content;margin:0 auto;background:#d9e1e9;padding:5px;border-radius:10px}.cross-block{width:30px;height:30px;background:#52606b;border-radius:3px}.cross-cell{position:relative;width:30px;height:30px;background:#fff;border:1px solid #c8d3de;border-radius:3px;display:block}.cross-letter{width:100%;height:100%;padding:4px 0 0;border:0!important;border-radius:2px!important;outline:0;text-align:center;text-transform:uppercase;font-weight:850;font-size:16px;color:#24394f;background:transparent!important;box-shadow:none!important}.cross-letter:focus{background:#fff0e4!important;box-shadow:inset 0 0 0 2px #ef741b!important}.cross-letter:disabled{color:#137750;opacity:1}.cross-number{position:absolute;z-index:1;top:0;left:2px;font-size:8px;line-height:9px;color:#617286;pointer-events:none}.active-cell{background:#fff0e4;border-color:#ef741b}.active-cell .cross-letter{background:#fff0e4!important}.solved-cell{background:#e5f6ed;border-color:#9ccfb3}.solved-cell .cross-number{color:#137750}.crossword-legend{display:flex;gap:16px;flex-wrap:wrap;color:#718197;font-size:11px;margin:4px 0 20px}.crossword-legend span{display:flex;align-items:center;gap:6px}.crossword-legend i{width:12px;height:12px;border-radius:3px;border:1px solid #ef741b;background:#fff0e4}.crossword-legend i.legend-solved{background:#e5f6ed;border-color:#9ccfb3}.cross-clues{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}.cross-clues h3{font-size:15px;margin:8px 0;color:#455b70}.cross-clue-list{display:grid;gap:7px}.cross-clue{position:relative;display:grid;grid-template-columns:25px minmax(0,1fr) auto;gap:8px;align-items:start;text-align:left;width:100%;padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px;color:#34495e}.cross-clue:hover,.cross-clue.active{border-color:#ef741b;background:#fff8f2}.cross-clue.solved{border-color:#b8dfc9;background:#f1faf5}.cross-clue-no{width:23px;height:23px;border-radius:7px;background:#eef3f8;display:grid;place-items:center;font-size:11px;font-weight:900}.cross-clue-text{font-size:12px;line-height:1.45}.cross-clue>small{font-size:10px;color:#8190a1;white-space:nowrap;padding-top:5px}.cross-clue-check{position:absolute;right:8px;top:-6px;color:#16835d;background:#fff;font-size:13px}@media(max-width:650px){.cross-board{margin-left:0;margin-right:0}.cross-clues{grid-template-columns:1fr}.cross-cell,.cross-block{width:27px;height:27px}.cross-letter{font-size:14px}.cross-board{grid-template-columns:repeat(21,27px)!important}}

</style></head><body><div class="shell"><div class="layout" id="gameLayout"><aside class="side" aria-label="Квиз"><h3>QUALITY QUEST</h3><button class="step active" data-step="0"><span class="num">01</span><span class="step-label">Квиз качества</span></button></aside><main class="panel" id="panel" tabindex="-1" aria-live="polite"></main></div></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const STORAGE_KEY='qualityQuestQuiz_v1';
const freshState=()=>({step:0,done:[false],answers:{}});
let state=freshState();
try{const stored=localStorage.getItem(STORAGE_KEY);if(stored){const parsed=JSON.parse(stored);if(parsed&&parsed.answers&&typeof parsed.answers==='object')state={...freshState(),...parsed};}}catch(e){}
state.answers=state.answers&&typeof state.answers==='object'?state.answers:{};
state.done=Array.isArray(state.done)&&state.done.length===1?state.done:[false];
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function updateStats(){const b=$('.step');if(b){b.classList.toggle('done',!!state.done[0]);const n=b.querySelector('.num');if(n)n.textContent=state.done[0]?'✓':'01';}}
function toast(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100);}
function finishStep(i){state.done[i]=true;saveProgress();updateStats();}
function shell(kicker,title,lead,body){return `<div class="round-top"><span class="round-kicker">${kicker}</span></div><h2>${title}</h2><p class="lead">${lead}</p>${body}`;}
function render(){renderQuiz($('#panel'));updateStats();}
const quizQuestions=[
{q:'Что является главным объектом внимания менеджмента качества?',a:['Готовая продукция','Потребитель, требования и процессы, создающие результат','Документы СМК'],right:1,why:'Менеджмент качества охватывает процессы и способность стабильно выполнять требования потребителей и других заинтересованных сторон.'},
{q:'Что означает цикл PDCA?',a:['Планируй — Делай — Проверяй — Действуй','Производи — Доставляй — Контролируй — Анализируй','Проверяй — Документируй — Согласовывай — Архивируй'],right:0,why:'PDCA — цикл постоянного улучшения: Plan, Do, Check, Act.'},
{q:'Для чего нужно корректирующее действие?',a:['Чтобы исправить формулировку в отчёте','Чтобы устранить причину несоответствия и предупредить повторение','Чтобы назначить виновного'],right:1,why:'Исправление устраняет обнаруженную проблему, а корректирующее действие работает с её причиной.'},
{q:'Для работы в первом в СССР Макдональдсе советских сотрудников обучали правилам, основанным на западной этике и психологии. Однако из-за выполнения одного из правил клиенты стали относиться к продавцам недоверчиво. Тогда владельцы разрешили сотрудникам не следовать этому правилу. О каком правиле идет речь?',a:['Улыбаться','Благодарить за заказ','Желать клиентам хорошего дня'],right:0,why:'Владельцы с удивлением обнаружили, что в сфере обслуживания Советского Союза не принято улыбаться. И улыбка продавца не только не способствует продажам, но и сбивает с толку. Недоверчивые русские интуитивно принимали улыбающегося им человека либо за дурачка, либо за жулика.'},
{q:'Кто отвечает за качество в компании?',a:['Отдел менеджмента качества','Руководители подразделений','Каждый сотрудник в рамках своей роли и процессов'],right:2,why:'Отдел качества помогает выстраивать систему, но качество создаётся всеми участниками процессов.'},
{q:'Чтобы защитить этот продукт от попадания бактерий при исполнении традиционного действия (которое сопровождается загадыванием желаний), Стивен Окрос запатентовал специальную прозрачную крышку с многочисленными отверстиями сверху. О каком продукте идет речь?',a:['Золотая рыбка','Торт','«Счастливый билетик»'],right:1,why:' Задувание свечей на торте увеличивает количество бактерий на нем в среднем в 14 раз. Изобретатель придумал прозрачную крышку для торта, с дырочками под свечи, которую после задувания можно спокойно снять, со всеми бактериями.'},
{q:'Как понять, что улучшение действительно сработало?',a:['По тому, что всем понравилась идея','По наличию приказа о внедрении','По проверенным данным и достижению ожидаемого результата'],right:2,why:'Результативность улучшения проверяют по фактам и показателям, а не только по факту внедрения.'},
{q:'Что такое риск в контексте процессов?',a:['Влияние неопределённости на достижение результата','Любая жалоба клиента','Финансовый ущерб'],right:0,why:'Риск связан с влиянием неопределённости на достижение целей; важно оценивать возможные последствия и принимать меры.'},
{q:'В зале ожидания аэропорта Йоханнесбурга стоит автомат, выдающий бесплатный кофе за это действие. Производители кофе настолько уверены в качестве своего продукта, что не боятся злоупотреблений. За какое действие выдается кофе?',a:['За слезы','За зевок','За улыбку'],right:1,why:' Автомат с кофе наливает горячий напиток лишь тем, кто зевает. Производители уверены, что люди не будут специально зевать, потому что, если они выпили один стаканчик кофе, второй им уже не понадобится.'},
{q:'Что делать, если вы хотите улучшить свою работу?',a:['Изменить порядок работы самостоятельно, никому об этом не сообщая','Создать предложение по улучшению','Переложить ответственность за улучшения на другого сотрудника'],right:1,why:'Если у вас есть идея, как улучшить рабочий процесс, оформите предложение по улучшению — вместе мы сделаем работу лучше.'},

const questionsForResult=quizQuestions.map(q=>q.right);
function renderQuiz(p){
const questions=quizQuestions;
state.answers.quiz=state.answers.quiz||{};
let idx=Number.isInteger(state.answers.quizIndex)?state.answers.quizIndex:0;
if(idx<0||idx>=questions.length)idx=0;
state.answers.quizIndex=idx;
const q=questions[idx];
const saved=state.answers.quiz;
const answered=Object.prototype.hasOwnProperty.call(saved,idx);
p.innerHTML=shell('Викторина о качестве · 17 ВОПРОСОВ','Квиз качества','Ответьте на 17 вопросов о качестве и системе менеджмента качества.',`
<div class="casebox"><b>Вопрос ${idx+1} из ${questions.length}</b><h3 style="margin:10px 0 4px">${q.q}</h3></div>
<div class="choice-list" id="quizChoices">${q.a.map((t,i)=>`<button type="button" class="choice" data-answer="${i}" ${answered?'disabled':''}><span class="radio-dot"></span><span>${t}</span></button>`).join('')}</div>
<div id="quizFeedback">${state.answers['quizFeedback'+idx]||''}</div>
<div class="actionrow"><button type="button" class="btn btn-dark" id="quizSubmit" ${answered?'disabled':''}>Проверить ответ</button>${answered?`<button type="button" class="btn btn-primary" id="quizNext">${idx===questions.length-1?'Посмотреть результат':'Следующий вопрос →'}</button>`:''}</div>
<div class="progress"><span style="width:${Object.keys(saved).length/questions.length*100}%"></span></div>`);
let choice=answered?saved[idx]:null;
const buttons=$$('#quizChoices .choice');
buttons.forEach(b=>{
 if(answered&&Number(b.dataset.answer)===choice)b.classList.add('selected');
 b.addEventListener('click',()=>{
  if(answered)return;
  choice=Number(b.dataset.answer);
  buttons.forEach(x=>x.classList.toggle('selected',x===b));
 });
});
$('#quizSubmit')?.addEventListener('click',()=>{
 if(choice===null||choice===undefined){toast('Сначала выбери один вариант ответа');return;}
 if(Object.prototype.hasOwnProperty.call(state.answers.quiz,idx))return;
 state.answers.quiz[idx]=choice;
 const ok=choice===q.right;
 state.answers['quizFeedback'+idx]=`<div class="feedback ${ok?'good':'info'}"><b>${ok?'Верно!':'Ответ не совсем точный.'}</b><br>${q.why}</div>`;
 if(idx===questions.length-1)finishStep(0);
 saveProgress();renderQuiz($('#panel'));updateStats();
 });
$('#quizNext')?.addEventListener('click',()=>{
 if(idx<questions.length-1){state.answers.quizIndex=idx+1;saveProgress();renderQuiz($('#panel'));}
 else{showResult();}
 });
}


function showResult(){
 const saved=state.answers.quiz||{};
 const correct=Object.keys(saved).filter(k=>Number(saved[k])===quizQuestions[Number(k)]?.right).length;
 const p=$('#panel');
 p.innerHTML=`<div class="result-hero"><div class="medal">✓</div><div class="round-kicker">Квиз завершён</div><h2>Спасибо за участие!</h2><p class="lead">Ты ответил на все вопросы квиза качества.</p><div class="score-big">${correct} / ${quizQuestions.length}</div><p class="lead">Правильных ответов</p></div><div class="feedback good">Качество начинается с внимания к требованиям, процессам и результатам нашей работы.</div><p class="footer-note">Результат сохраняется в этом браузере.</p>`;
 updateStats();
}
render();
</script></body></html>
