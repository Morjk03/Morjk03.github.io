<script>
"use strict";
const $ = id => document.getElementById(id);
const menu = JSON.parse($("menuData").textContent);
const dry = "no-alcohol";
const names = new Map([...menu.map(d => [d.id, d.name]), [dry, "Буду без алкоголя"]]);
const config = window.POLNOCH_CONFIG || {};
const groups = ["Все", "Цитрусовые", "Ягодные", "Тропические", "Освежающие"];
let group = "Все", selected = [], saved = [], key = "", state = "loading", surpriseId = null;
const cards = new Map();
const photo = i => `--x:${(i % 4) * 100 / 3}%;--y:${Math.floor(i / 4) * 100 / 3}%`;
const visibleDrinks = () => menu.filter(d => group === "Все" || d.group === group);
const same = (a, b) => a.length === b.length && a.every(id => b.includes(id));
function validConfig() {
  try {
    const base = new URL(config.projectUrl);
    return base.protocol === "https:" && base.origin === config.projectUrl.replace(/\/$/, "") &&
      /^sb_publishable_[A-Za-z0-9_-]+$/.test(config.publishableKey);
  } catch { return false; }
}
async function rpc(method, args = {}) {
  const res = await fetch(config.projectUrl.replace(/\/$/, "") + "/rest/v1/rpc/polnoch_2027_" + method, {
    method: "POST", mode: "cors", credentials: "omit", cache: "no-store",
    headers: { "apikey": config.publishableKey, "Content-Type": "application/json" },
    body: JSON.stringify(args)
  });
  if (!res.ok) throw Error("RPC " + method + " returned " + res.status);
  return res.json();
}
function getKey() {
  const storage = "polnoch-2027:" + new URL(config.projectUrl).origin;
  let token = localStorage.getItem(storage);
  if (!/^[a-f0-9]{32}$/.test(token || "")) {
    token = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
    localStorage.setItem(storage, token);
  }
  return token;
}
function box(html) {
  $("content").innerHTML = html;
  if (!$("dialog").open) $("dialog").showModal();
}
$("close").onclick = () => $("dialog").close();
$("dialog").addEventListener("click", e => {
  if (e.target !== $("dialog")) return;
  const r = $("dialog").getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) $("dialog").close();
});
function render() {
  const waiting = state !== "ready";
  for (const [id, button] of cards) {
    const active = selected.includes(id);
    button.classList.toggle("selected", active);
    button.setAttribute("aria-pressed", String(active));
    button.querySelector(".check").textContent = active ? "✓" : "+";
    button.disabled = waiting;
  }
  $("dry").classList.toggle("selected", selected.includes(dry));
  $("dry").setAttribute("aria-pressed", String(selected.includes(dry)));
  $("dry").disabled = waiting;
  $("statusTitle").textContent = selected.includes(dry) ? "Мой выбор — без алкоголя" : "Выбрано " + selected.length + " из 3";
  $("statusSub").textContent = saved.length && same(saved, selected) ? "Ваш ответ сохранён" : "Анонимное голосование";
  const retry = state === "error";
  $("vote").disabled = !retry && (waiting || !selected.length || same(selected, saved));
  $("vote").textContent = retry ? "Повторить" : state === "saving" ? "Сохраняем…" :
    state === "loading" ? "Загружаем…" : saved.length ? "Сохранить изменения" : "Отправить голос";
}
function pick(id) {
  if (state !== "ready") return;
  $("note").textContent = "";
  if (selected.includes(id)) selected = selected.filter(x => x !== id);
  else if (id === dry) selected = [dry];
  else if (selected.length >= 3) {
    $("note").textContent = "Уже выбрано три коктейля. Снимите одну отметку, чтобы выбрать другой.";
    return;
  } else selected = [...selected.filter(x => x !== dry), id];
  render();
}
for (const drink of menu) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "card"; b.setAttribute("aria-label", drink.name + ", " + drink.note);
  b.innerHTML = `<span class="shot" style="${photo(drink.index)}" aria-hidden="true"></span><span class="check" aria-hidden="true">+</span><span class="body"><strong>${drink.name}</strong><small>${drink.note}</small></span>`;
  b.onclick = () => pick(drink.id);
  cards.set(drink.id, b); $("cards").append(b);
}
for (const name of groups) {
  const chip = document.createElement("button");
  chip.type = "button"; chip.className = "chip"; chip.textContent = name;
  chip.setAttribute("aria-pressed", String(name === group));
  chip.onclick = () => {
    group = name;
    $("filters").querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b === chip)));
    for (const d of menu) cards.get(d.id).hidden = group !== "Все" && d.group !== group;
  };
  $("filters").append(chip);
}
function surprise() {
  const visible = visibleDrinks();
  const others = visible.filter(d => d.id !== surpriseId);
  const pool = others.length ? others : visible;
  const d = pool[Math.floor(Math.random() * pool.length)];
  surpriseId = d.id;
  box(`<div class="poster-pic" style="background:${d.bg}"><span class="shot" style="${photo(d.index)}"></span></div>
    <div class="modal-body"><div class="dialog-kicker">${d.group}</div><h2>${d.name}</h2><p>${d.tasting}</p>
    <div class="buttons"><button class="dark-btn" id="detailPick">${selected.includes(d.id) ? "Убрать из выбора" : "Добавить к выбору"}</button><button class="ghost" id="again">Ещё идея</button></div></div>`);
  $("detailPick").disabled = state !== "ready";
  $("detailPick").onclick = () => { $("dialog").close(); pick(d.id); };
  $("again").onclick = surprise;
}
async function connect() {
  $("note").textContent = "";
  if (!validConfig()) {
    state = "config"; render(); $("vote").textContent = "Опрос не настроен";
    $("note").textContent = "Организатору нужно проверить публичный ключ проекта в файле config.js.";
    return;
  }
  state = "loading"; render();
  try {
    key = getKey();
    const data = await rpc("read", { p_token: key });
    saved = data.choices; selected = [...saved]; state = "ready";
  } catch {
    state = "error";
    $("note").textContent = "Не удалось открыть бюллетень. Проверьте подключение и разрешите браузеру сохранять данные этого сайта.";
  }
  render();
}
async function submit() {
  if (state === "error") return connect();
  if (state !== "ready" || !selected.length || same(selected, saved)) return;
  $("note").textContent = ""; state = "saving"; render();
  try {
    const data = await rpc("save", { p_token: key, p_choices: selected });
    saved = data.choices; selected = [...saved];
    box(`<div class="modal-body"><div class="dialog-kicker">Голос учтён</div><h2>Записали ваш заказ!</h2><p>${saved.map(id => names.get(id)).join(" · ")}</p><div class="buttons"><button class="dark-btn" id="showStats">Посмотреть результаты</button><button class="ghost" id="backMenu">К меню</button></div></div>`);
    $("showStats").onclick = stats; $("backMenu").onclick = () => $("dialog").close();
  } catch {
    $("note").textContent = "Не удалось подтвердить отправку. Отправьте тот же выбор ещё раз — он будет учтён один раз.";
  } finally { state = "ready"; render(); }
}
async function stats() {
  box('<div class="modal-body"><div class="dialog-kicker">Общие результаты</div><h2>Выбор коллег</h2><p id="numbers" aria-live="polite">Загружаем ответы…</p><ul class="stats" id="ranking"></ul></div>');
  const message = $("numbers");
  try {
    const data = await rpc("results");
    if (message !== $("numbers")) return;
    message.textContent = "Всего участников — " + data.total + ".";
    const ids = [...names.keys()].sort((a,b) => (data.counts[b] || 0) - (data.counts[a] || 0));
    $("ranking").innerHTML = ids.map(id => `<li><span>${names.get(id)}</span><b>${Number(data.counts[id] || 0)}</b></li>`).join("");
  } catch { message.textContent = "Не удалось загрузить результаты. Попробуйте открыть их ещё раз."; }
}
$("dry").onclick = () => pick(dry);
$("shuffle").onclick = surprise;
$("vote").onclick = submit;
$("results").onclick = stats;
$("resultsWrap").hidden = !validConfig();
$("instruction").textContent = "Отметьте до трёх коктейлей прямо на карточках.";
connect();

</script></body></html>
